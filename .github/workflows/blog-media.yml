name: Copy blog photos
on:
  workflow_dispatch:
  push:
    branches: [stories]
    paths:
      - scripts/fetch-blog-media.mjs
      - .github/workflows/blog-media.yml
permissions:
  contents: write
jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: which mogrify || (sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick)
      - run: node scripts/fetch-blog-media.mjs
      - name: Save photos
        run: |
          git config user.name "route-and-range-bot"
          git config user.email "actions@users.noreply.github.com"
          git add media
          git diff --cached --quiet || git commit -m "Blog photos copied from the old site"
          git pull --rebase
          git push
