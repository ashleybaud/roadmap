name: Social posts
on:
  schedule: [{ cron: "17 4 * * *" }]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: which mogrify || (sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick)
      - run: node scripts/fetch-social.mjs
        env: { META_TOKEN: "${{ secrets.META_TOKEN }}" }
      - name: Save
        run: |
          git config user.name "route-and-range-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data/social.json media/social
          git diff --cached --quiet || git commit -m "Social posts updated"
          git pull --rebase
          git push
