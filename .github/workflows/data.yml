name: Refresh map data
on:
  schedule:
    - cron: "17 2 1 * *"
  workflow_dispatch:
    inputs:
      only:
        description: "Only these sets, comma separated (blank = all)"
        required: false
        default: ""
  push:
    paths:
      - scripts/fetch-data.mjs
      - .github/workflows/data.yml
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-data.mjs
        env:
          ONLY: ${{ github.event.inputs.only || (github.event_name == 'push' && 'towns' || '') }}
      - name: Save data
        run: |
          git config user.name "route-and-range-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Refresh map data"
          git pull --rebase
          git push
