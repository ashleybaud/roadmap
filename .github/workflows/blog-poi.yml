name: Blog places
on:
  workflow_dispatch:
  push:
    branches: [poi]
    paths: [scripts/geocode-blog-poi.mjs, .github/workflows/blog-poi.yml]
permissions: { contents: write }
jobs:
  geo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/geocode-blog-poi.mjs
      - run: |
          git config user.name "route-and-range-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/blog-poi.json
          git diff --cached --quiet || git commit -m "Blog places looked up"
          git push
