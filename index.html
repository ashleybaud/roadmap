<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Route and Range</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: trip bar on top; big map left with day tabs and details right; one column on phones */
:root{
  --bg:#EEF0EA; --panel:#FFFFFF; --ink:#18201C; --muted:#5C6660; --line:#D3D8CF;
  --accent:#0B6E4F; --back:#2F5BA8; --ok:#2E7D32; --warn:#B26A00; --bad:#B3261E; --chip:#E3E7DE; --onfill:#FFFFFF;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#121614; --panel:#1B201D; --ink:#E6EAE4; --muted:#9AA49D; --line:#2E3631;
  --accent:#3FB48A; --back:#7EA3E6; --ok:#2F8A3B; --warn:#B87400; --bad:#C2392F; --chip:#252B27; --onfill:#FFFFFF; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-block:12px 48px}
.wrap{max-width:1400px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
h1,h2,h3{font-family:var(--f-display);margin:0;letter-spacing:.01em;text-wrap:balance}
h1{font-size:1.8rem;font-weight:700;line-height:1}
h2{font-size:1.3rem;font-weight:700}
h3{font-size:1.1rem;font-weight:600}
.lbl{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.note{color:var(--muted);font-size:.82rem}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
a{color:var(--accent)}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;border-bottom:2px solid var(--ink);padding-bottom:8px}
input,select,button{font:inherit;color:inherit}
input[type=text],input[type=number],input[type=time],input[type=date],select{background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:7px 9px;width:100%}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:4px;padding:7px 12px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.small{padding:4px 8px;font-size:.8rem}
.icon{border:1px solid var(--line);background:var(--panel);border-radius:4px;width:30px;height:30px;cursor:pointer;display:inline-grid;place-items:center;flex:none}
.btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px;min-width:0}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.chk{display:flex;align-items:center;gap:6px;font-size:.82rem;color:var(--muted)}
.status{font-size:.85rem;color:var(--accent);min-height:1.2em}
.banner{font-size:.85rem;padding:6px 10px;border-left:4px solid var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent);border-radius:4px}

/* trip bar */
.tripbar{display:grid;grid-template-columns:150px 150px minmax(0,1fr) minmax(0,1fr) auto;gap:10px;align-items:end}
@media (max-width:1000px){.tripbar{grid-template-columns:1fr 1fr}.tripbar .wide{grid-column:1/-1}}
.ac{position:relative}
.sugg{position:absolute;z-index:1600;left:0;right:0;top:100%;background:var(--panel);border:1px solid var(--line);border-radius:4px;box-shadow:0 6px 20px rgba(0,0,0,.15);max-height:260px;overflow:auto}
.sugg button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;cursor:pointer;border-bottom:1px solid var(--line)}
.sugg button:hover,.sugg button:focus{background:var(--chip)}

/* work area */
.work{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(360px,1fr);gap:12px;align-items:start}
@media (max-width:1000px){.work{grid-template-columns:minmax(0,1fr)}}
.mapcol{position:sticky;top:10px;display:flex;flex-direction:column;gap:8px}
@media (max-width:1000px){.mapcol{position:static}}
#map{height:calc(100vh - 230px);min-height:420px;border-radius:6px;border:1px solid var(--line)}
@media (max-width:1000px){#map{height:380px;min-height:0}}
.mapbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.layers{position:relative}
.layers summary{list-style:none;display:inline-block}
.layers summary::-webkit-details-marker{display:none}
.layerlist{position:absolute;z-index:1100;top:calc(100% + 4px);left:0;background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:220px}
.layerlist label{display:flex;align-items:center;gap:8px;font-size:.86rem;cursor:pointer}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%}
.leaflet-container{font:inherit}

/* day tabs + details */
.daytabs{display:flex;gap:4px;overflow-x:auto;border-bottom:2px solid var(--ink);padding-bottom:0;scrollbar-width:thin}
.dtab{border:1px solid var(--line);border-bottom:0;background:var(--bg);border-radius:6px 6px 0 0;padding:6px 10px;cursor:pointer;white-space:nowrap;display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-width:max-content}
.dtab b{font-family:var(--f-display);font-size:1rem}
.dtab .note{font-size:.72rem}
.dtab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dtab.on .note{color:var(--bg);opacity:.8}
.dtab .tdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-left:4px;vertical-align:middle}
.details{display:flex;flex-direction:column;gap:12px;padding-top:12px}
.sumrow{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.stat{display:flex;flex-direction:column}
.stat .v{font-family:var(--f-mono);font-size:1rem;font-weight:500}
.verdict{font-weight:600;font-size:.84rem;padding:6px 9px;border-radius:4px;border-left:4px solid}
.v-warn{border-color:var(--warn);color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent)}
.v-bad{border-color:var(--bad);color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent)}
.seg{display:inline-flex;border:1px solid var(--ink);border-radius:6px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 12px;cursor:pointer;font-weight:600;font-size:.85rem}
.seg button.on{background:var(--ink);color:var(--bg)}

/* pills: distance next to fuel */
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:5px;padding:3px 8px;font-size:.8rem;font-weight:600;white-space:nowrap}
.pill svg{width:14px;height:14px;flex:none}
.pill.dist{background:var(--chip);font-family:var(--f-mono);font-weight:500;cursor:pointer}
.pill.fok{background:var(--ok);color:var(--onfill)}
.pill.fwarn{background:var(--warn);color:var(--onfill)}
.pill.fbad{background:var(--bad);color:var(--onfill)}
.pill.foff{background:var(--chip);color:var(--muted)}
.pill.btnlike{cursor:pointer;border:0}

/* route list */
.rlist{display:flex;flex-direction:column}
.rpt{display:grid;grid-template-columns:24px minmax(0,1fr);gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.rpt:first-child{border-top:0}
.pin{width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--bg);font:600 .7rem var(--f-mono);display:grid;place-items:center;margin-top:5px}
.pin.night{background:var(--back)}
.pin.fuel{background:var(--accent);border-radius:4px}
.rbody{display:flex;flex-direction:column;gap:6px;min-width:0}
.rname{display:flex;gap:6px;align-items:center}
.rname input{flex:1;min-width:0}
.rname .fixed{font-weight:600;flex:1;min-width:0;overflow-wrap:anywhere;padding:5px 0}
.strip{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.strip select{width:auto;padding:3px 6px;font-size:.8rem}
.chip2{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:3px 9px;font-size:.8rem;font-weight:600;cursor:pointer;color:var(--ink)}
.chip2 svg{width:14px;height:14px}
.chip2.stay{border-color:var(--back);color:var(--back)}
.sugrow{display:flex;gap:8px;align-items:center;font-size:.8rem;color:var(--muted);margin-left:32px;padding:2px 0}
.sugrow svg{width:13px;height:13px;color:var(--accent)}
.legopts{position:relative}
.legopts summary{list-style:none;width:28px;height:28px;font-weight:700}
.legopts summary::-webkit-details-marker{display:none}
.legmenu{position:absolute;z-index:1200;right:0;top:calc(100% + 4px);background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:10px;display:flex;flex-direction:column;gap:8px;min-width:250px}
.nightrow{display:grid;grid-template-columns:120px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
@media (max-width:560px){.nightrow{grid-template-columns:1fr auto}.nightrow .when{grid-column:1/-1}}
.dayline{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);cursor:pointer}
.dayline b{font-family:var(--f-display);font-size:1.05rem;min-width:56px}

/* stop panel */
.sheet{position:fixed;z-index:1500;right:max(14px,calc((100vw - 1400px)/2 + 14px));top:80px;width:400px;max-height:calc(100vh - 100px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 12px 40px rgba(0,0,0,.25)}
@media (max-width:1000px){.sheet{left:0;right:0;top:auto;bottom:0;width:auto;max-height:58vh;border-radius:12px 12px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}}
.dlghead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:12px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:1}
.ptabs{display:flex;gap:4px;padding:8px 12px 0;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{display:inline-flex;align-items:center;gap:5px;border:0;border-bottom:3px solid transparent;background:none;padding:6px 8px;cursor:pointer;font-weight:600;white-space:nowrap}
.tab svg{width:15px;height:15px}
.tab.on{border-bottom-color:var(--ink)}
.dlgbody{padding:10px 14px 14px;display:flex;flex-direction:column;gap:8px}
.item{border:1px solid var(--line);border-radius:6px;padding:10px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start;background:var(--bg);overflow-wrap:anywhere}
.item .meta{display:flex;flex-direction:column;gap:2px;min-width:0}
.peek{position:fixed;z-index:2000;background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:8px 10px;width:290px;font-size:.82rem;display:flex;flex-direction:column;gap:5px;pointer-events:none}
dialog{border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);padding:18px;width:min(440px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(0,0,0,.4)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>Route and Range</h1><div class="note">Plan the ride, the fuel and the night stops.</div></div>
    <div class="btns"><span class="lbl mono" id="hdrSummary"></span><button class="btn ghost" id="openSettings" type="button">Settings</button></div>
  </header>

  <section class="panel tripbar" aria-label="Trip">
    <div class="field"><label class="lbl" for="startDate">Leave</label><input id="startDate" type="date"></div>
    <div class="field"><label class="lbl" for="endDate">Back</label><input id="endDate" type="date"></div>
    <div class="field ac wide"><label class="lbl" for="startPlace">Start</label><input id="startPlace" type="text" autocomplete="off" placeholder="Town or place"><div class="sugg" hidden></div></div>
    <div class="field ac wide"><label class="lbl" for="endPlace">Finish</label><input id="endPlace" type="text" autocomplete="off" placeholder="Town or place"><div class="sugg" hidden></div></div>
    <div class="field"><label class="chk"><input type="checkbox" id="roundTrip"> Finish where I started</label><button class="btn ghost small" id="useLoc" type="button">Start from my location</button></div>
  </section>
  <div class="banner" id="styleBanner"></div>

  <div class="work">
    <div class="mapcol">
      <div class="mapbar">
        <details class="layers" id="layersBox"><summary class="btn ghost small">Show on map</summary><div class="layerlist" id="layers"></div></details>
        <span class="status" id="status" role="status"></span>
      </div>
      <div id="map"></div>
    </div>
    <div class="panel" style="padding-top:8px">
      <div class="daytabs" id="dayTabs" role="tablist"></div>
      <div class="details" id="details"></div>
    </div>
  </div>
</div>

<aside id="panel" class="sheet" hidden aria-label="Stop details"><div class="dlghead"><div><h2 id="pTitle"></h2><div class="note" id="pSub"></div></div><button class="icon" type="button" id="pClose" aria-label="Close">✕</button></div><div class="ptabs" id="pTabs"></div><div id="pBody" class="dlgbody"></div></aside>
<div id="peek" class="peek" hidden></div>

<dialog id="settings">
  <form method="dialog" style="display:flex;flex-direction:column;gap:12px">
    <h2>Settings</h2>
    <div class="row2">
      <div class="field"><label class="lbl" for="range">Range on a full tank (km)</label><input id="range" type="number" min="60" max="1200" step="5" value="200"></div>
      <div class="field"><label class="lbl" for="reserve">Arrive with at least (km)</label><input id="reserve" type="number" min="0" max="300" step="5" value="30"></div>
    </div>
    <div class="row2">
      <div class="field"><label class="lbl" for="leave">Leave each day at</label><input id="leave" type="time" value="08:00"></div>
      <div class="field"><label class="lbl" for="pace">Slower than normal by (%)</label><input id="pace" type="number" min="0" max="100" step="5" value="0"></div>
    </div>
    <div class="row2">
      <div class="field"><label class="lbl" for="fuelMode">Fuel</label><select id="fuelMode"><option value="suggest">Suggest fuel stops and warn</option><option value="warn">Warn only</option><option value="off">Off</option></select></div>
      <div class="field"><label class="lbl" for="maxHours">Longest riding day (hours)</label><input id="maxHours" type="number" min="2" max="16" step="0.5" value="8"></div>
    </div>
    <div class="field"><label class="lbl" for="style">Route style</label><select id="style"><option value="rough">Road less travelled: back roads and gravel first</option><option value="mixed">Mixed: gravel when it saves time</option><option value="tar">Tar: main roads and highways</option></select><span class="note">Road less travelled is often the shortest and toughest way. Check your bike, tyres and skills match it. Any day can be switched to Liaison.</span></div>
    <div class="field"><label class="lbl" for="corridor">Show places up to (km) off the route</label><input id="corridor" type="number" min="1" max="20" step="1" value="5"></div>
    <div class="btns" style="justify-content:flex-end"><button class="btn" value="ok">Done</button></div>
  </form>
</dialog>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const OSRM="https://router.project-osrm.org/route/v1/driving/";
const PHOTON="https://photon.komoot.io/api/";
const VALHALLA="https://valhalla1.openstreetmap.de/route";
const OVERPASS="/api/places";
const TYPES=[
  {id:"view",n:"Viewpoints",c:"#2F5BA8",on:true},
  {id:"pass",n:"Mountain passes",c:"#6B4E9B",on:true},
  {id:"sight",n:"Sights & history",c:"#9A6A33",on:true},
  {id:"food",n:"Food & coffee",c:"#B3261E",on:false},
  {id:"camp",n:"Campsites",c:"#0B6E4F",on:false}
];
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const rad=d=>d*Math.PI/180;
const hav=(a,b)=>{const dl=rad(b.lat-a.lat),dn=rad(b.lon-a.lon);const h=Math.sin(dl/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dn/2)**2;return 12742*Math.asin(Math.sqrt(h));};
const fmtT=m=>{m=Math.round(m);return String(Math.floor(m/60)%24).padStart(2,"0")+":"+String(((m%60)+60)%60).padStart(2,"0");};
const fmtDur=m=>{m=Math.round(m);return Math.floor(m/60)+"h"+String(m%60).padStart(2,"0");};
const toMin=t=>{const [h,m]=(t||"0:0").split(":").map(Number);return h*60+m;};

const ICON={
  fuel:`<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 3h9a1 1 0 0 1 1 1v8h1.5A2.5 2.5 0 0 1 18 14.5V18a1 1 0 0 0 2 0V9.4l-2.7-2.7 1.4-1.4 3 3c.2.2.3.5.3.7V18a3 3 0 0 1-6 0v-3.5a.5.5 0 0 0-.5-.5H14v7h1v2H2v-2h1V4a1 1 0 0 1 1-1zm1 2v5h7V5H5z"/></svg>`,
  stay:`<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 5h2v8h6V8h7a3 3 0 0 1 3 3v8h-2v-3H5v3H3V5zm4 3.5a2 2 0 1 1 0 4 2 2 0 0 1 0-4z"/></svg>`,
  food:`<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 2h2v7a2 2 0 0 1-1 1.7V22H6V10.7A2 2 0 0 1 5 9V2h2v6h0V2zm9 0c2 0 3 2.5 3 6s-1 4.5-2 5v9h-2V2h1z"/></svg>`,
  sight:`<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l2.9 6.3 6.9.7-5.2 4.6 1.5 6.8L12 17l-6.1 3.4 1.5-6.8L2.2 9l6.9-.7z"/></svg>`
};

function parseGpx(text){
  const doc=new DOMParser().parseFromString(text,"application/xml");
  let nodes=[...doc.getElementsByTagName("trkpt")]; if(!nodes.length) nodes=[...doc.getElementsByTagName("rtept")];
  return nodes.map(n=>({lat:+n.getAttribute("lat"),lon:+n.getAttribute("lon")})).filter(p=>isFinite(p.lat)&&isFinite(p.lon));
}

/* place search: our own town list first (typo-tolerant), then the worldwide search */
const norm=x=>String(x||"").toLowerCase().normalize("NFD").replace(/[^a-z]/g,"");
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let prev=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const cur=[i];for(let j=1;j<=n;j++)cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));prev=cur;}return prev[n];}
let townsP=null;
function allTowns(){
  if(!townsP) townsP=Promise.all(Object.keys(COUNTRY_BOX).map(cc=>fetch(`/data/${cc}/towns.json`).then(r=>r.ok?r.json():[]).catch(()=>[]).then(rows=>rows.map(r=>({name:r[2],lat:r[0],lon:r[1],place:r[3],sub:r[4]||cc.toUpperCase(),n:norm(r[2])})))))
    .then(a=>a.flat());
  return townsP;
}
const RANK={city:0,town:1,village:2,hamlet:3};
async function searchPlaces(q,c,signal){
  const nq=norm(q); const out=[];
  const towns=await allTowns();
  if(towns.length&&nq.length>=3){
    const tol=nq.length>7?2:1;
    towns.map(t=>{const pre=lev(nq,t.n.slice(0,nq.length));const full=lev(nq,t.n);return {t,d:Math.min(pre+0.5*(t.n.length>nq.length),full)};})
      .filter(x=>x.d<=tol).sort((a,b)=>a.d-b.d||(RANK[a.t.place]??4)-(RANK[b.t.place]??4)).slice(0,5)
      .forEach(x=>out.push({name:x.t.name,sub:[x.t.place,x.t.sub].filter(Boolean).join(", "),lat:x.t.lat,lon:x.t.lon}));
  }
  const variants=[...new Set([q,q.replace(/\d+/g,""),q.replace(/\s+/g,"")])].filter(v=>v.trim().length>=3);
  const res=await Promise.all(variants.map(v=>fetch(`${PHOTON}?q=${encodeURIComponent(v)}&limit=6&lat=${c.lat.toFixed(3)}&lon=${c.lng.toFixed(3)}&location_bias_scale=0.5`,{signal}).then(r=>r.json()).catch(()=>({features:[]}))));
  res.flatMap(j=>j.features||[]).forEach(f=>{const p=f.properties;const [lon,lat]=f.geometry.coordinates;
    out.push({name:p.name||p.street||q,sub:[p.city||p.county,p.state,p.country].filter(x=>x&&x!==p.name).join(", "),lat,lon});});

function sunset(date,lat,lng){
  const dayMs=86400000,J1970=2440588,J2000=2451545,e=rad(23.4397),J0=0.0009;
  const toDays=d=>d.valueOf()/dayMs-0.5+J1970-J2000;
  const M=d=>rad(357.5291+0.98560028*d);
  const L=m=>m+rad(1.9148*Math.sin(m)+0.02*Math.sin(2*m)+0.0003*Math.sin(3*m))+rad(102.9372)+Math.PI;
  const lw=rad(-lng),phi=rad(lat),d=toDays(date),n=Math.round(d-J0-lw/(2*Math.PI));
  const ds=J0+lw/(2*Math.PI)+n,m=M(ds),l=L(m),dec=Math.asin(Math.sin(e)*Math.sin(l));
  const w=Math.acos((Math.sin(rad(-0.833))-Math.sin(phi)*Math.sin(dec))/(Math.cos(phi)*Math.cos(dec)));
  const a=J0+(w+lw)/(2*Math.PI)+n, Jset=J2000+a+0.0053*Math.sin(m)-0.0069*Math.sin(2*l);
  return new Date((Jset+0.5-J1970)*dayMs);
}

function fuelPlan(){

  const mine=[]; plan.days.forEach(d=>{if(!d)return; d.pts.forEach(p=>{if(p.type==="fuel"&&plan.ptKm.has(p)) mine.push({id:"me"+mine.length,lat:p.lat,lon:p.lon,name:p.name,km:plan.ptKm.get(p),mine:true});});});
  const st=[...mine,...(placesOk?fuelStations:[])].sort((a,b)=>a.km-b.km).filter((x,i,a)=>!a.slice(0,i).some(o=>Math.abs(o.km-x.km)<1));
  let pos=0,tank=range,guard=0; const fills=[],gaps=[];
  const use=s=>{tank-=s.km-pos; fills.push(Object.assign({},s,{arrive:tank})); pos=s.km; tank=range;};
  while(pos<total&&guard++<500){
    const nextMine=mine.find(m=>m.km>pos+0.3&&m.km<=pos+tank);
    if(pos+tank-reserve>=total&&!nextMine) break;
    if(nextMine){use(nextMine);continue;}
    const reach=st.filter(s=>s.km>pos+0.3&&s.km<=pos+tank-reserve);
    if(reach.length){use(reach[reach.length-1]);continue;}
    const next=st.find(s=>s.km>pos+0.3);
    if(!next||next.km>pos+tank){gaps.push({from:pos,to:next?next.km:total}); if(!next) break;}
    use(Object.assign({},next,{tight:true}));

  const tankAt=km=>{let p=0,t=range;for(const f of fills){if(f.km>km)break;t-=f.km-p;p=f.km;t=range;}return t-(km-p);};

  if(min<0) return {level:"bad",short:gap?`No fuel ${Math.round(gap.to-gap.from)} km`:"Runs dry",text:gap?`${Math.round(gap.to-gap.from)} km with no fuel known. Range ${settings.range} km.`:"Runs dry before the end of this stretch."};
  if(min<+settings.reserve) return {level:"warn",short:`Reserve: ${Math.round(min)} km`,text:`Down to ${Math.round(min)} km of fuel, below your ${settings.reserve} km reserve.`};
  return {level:"",short:"Fuel OK",text:`Never below ${Math.round(min)} km of fuel.`};
}
function fuelPill(f){

  return `<span class="pill ${f.level==="bad"?"fbad":f.level==="warn"?"fwarn":"fok"}" title="${esc(f.text)}">${ICON.fuel}${esc(f.short)}</span>`;
}
const distPill=(km,min,attrs)=>`<span class="pill dist" ${attrs||""} title="Show on the map">${Math.round(km)} km · ${fmtDur(min)}</span>`;
function dayMinutes(k){
  const d=plan&&plan.days[k]; if(!d) return 0;
  const pace=1+(+settings.pace||0)/100, stopMin=d.pts.slice(1,-1).reduce((t,p)=>t+(STOP_TYPES[p.type]?.min||0),0);
  const auto=settings.fuelMode==="suggest"&&fp?fp.fills.filter(f=>!f.mine&&f.km>d.a&&f.km<=d.b).length:0;
  return d.min*pace+stopMin+auto*10;

/* ---------- search wiring ---------- */
function wireSearch(input,list,onPick){
  let t,ctl;
  input.addEventListener("input",()=>{
    clearTimeout(t); const q=input.value.trim(); if(q.length<3){list.hidden=true;return;}
    t=setTimeout(async()=>{
      ctl?.abort(); ctl=new AbortController();
      const c=map?map.getCenter():{lat:-33,lng:19};
      try{
        const hits=await searchPlaces(q,c,ctl.signal);
        list.innerHTML=hits.map((h,k)=>`<button type="button" data-k="${k}"><b>${esc(h.name)}</b><br><span class="note">${esc(h.sub)}</span></button>`).join("")||`<div class="note" style="padding:8px">No match. Try a nearby town.</div>`;
        list.hidden=false;
        list.querySelectorAll("button").forEach(b=>b.addEventListener("mousedown",e=>{e.preventDefault();const h=hits[+b.dataset.k];list.hidden=true;onPick(pt(h.name,h.lat,h.lon));}));
      }catch(e){}
    },300);
  });
  input.addEventListener("blur",()=>setTimeout(()=>list.hidden=true,200));
}
function searchBox(id,value,placeholder){return `<div class="ac" style="flex:1;min-width:0"><input type="text" id="${id}" value="${esc(value||"")}" placeholder="${esc(placeholder)}" autocomplete="off"><div class="sugg" hidden></div></div>`;}

function insertVia(k,p){

  if(!panel) return; const {k,j}=panel, sc=scope(k,j), d=trip.days[k], at=Math.max(0,sc.jj-1);
  const f=e.target.closest("[data-pfuel]"),sy=e.target.closest("[data-pstay]"),ad=e.target.closest("[data-padd]");
  if(f){const x=fuelAll.find(q=>q.id===f.dataset.pfuel); if(!x) return; d.vias.splice(Math.min(at,d.vias.length),0,pt(x.name&&x.name!=="Fuel"?x.name:"Fuel stop",x.lat,x.lon,{type:"fuel"})); d.legs=[]; closePanel(true); $("status").textContent="Fuel stop added."; changed();}
  if(sy){const x=(stayFor(sc.p)?.places||[]).find(q=>q.id===sy.dataset.pstay); if(!x) return; d.to=pt(x.name,x.lat,x.lon); closePanel(true); $("status").textContent=`Night ${k+1}: ${x.name}.`; changed();}
  if(ad){const x=pois.find(q=>q.id===ad.dataset.padd); if(!x) return; d.vias.splice(Math.min(at,d.vias.length),0,pt(x.name,x.lat,x.lon,{type:x.kind==="food"?"lunch":"sight"})); d.legs=[]; closePanel(true); $("status").textContent=`Added ${x.name}.`; changed();}
});
const canHover=window.matchMedia("(hover: hover) and (pointer: fine)").matches;
function hidePeek(){ $("peek").hidden=true; }
$("details").addEventListener("mouseover",e=>{
  if(!canHover) return; const b=e.target.closest('[data-panel$=":stay"]'); if(!b) return;
  const [k,j]=b.dataset.panel.split(":"), sc=scope(+k,j==="last"?"last":+j); if(!sc) return; const sf=stayFor(sc.p); if(!sf||!sf.places.length) return;
  const r=b.getBoundingClientRect(), pk=$("peek");
  pk.innerHTML=`<b>Places to stay near ${esc(sc.p.name)}</b>`+sf.places.slice(0,6).map(p=>`<div><b>${esc(p.name)}</b><br><span class="note">${esc((p.tags.tourism||"").replace("_"," "))} · ${p.dist.toFixed(1)} km${p.tags.phone?" · "+esc(p.tags.phone):""}</span></div>`).join("")+`<span class="note">Click for all ${sf.places.length}</span>`;
  pk.hidden=false; pk.style.left=Math.max(8,Math.min(r.left,innerWidth-300))+"px"; pk.style.top=(r.bottom+6)+"px";
});
$("details").addEventListener("mouseout",e=>{if(e.target.closest('[data-panel$=":stay"]')) hidePeek();});

/* ---------- map ---------- */
let map,layer,focusR=null;
function focusRange(a,b){focusR={a:Math.min(a,b),b:Math.max(a,b)}; drawMap(); if(window.innerWidth<=1000) $("map").scrollIntoView({behavior:"smooth",block:"start"});}
const dotIcon=(c,sz,sq)=>L.divIcon({className:"",html:`<div style="width:${sz}px;height:${sz}px;background:${c};border:2px solid #18201C;border-radius:${sq?"2px":"50%"}"></div>`,iconSize:[sz,sz],iconAnchor:[sz/2,sz/2]});
function ensureMap(){ if(!map){map=L.map("map",{scrollWheelZoom:true});L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:17,attribution:"© OpenStreetMap contributors"}).addTo(map);map.setView([-31,20],5); if(window.ResizeObserver) new ResizeObserver(()=>map.invalidateSize()).observe($("map"));} map.invalidateSize(); if(layer) layer.remove(); layer=L.layerGroup().addTo(map); }
const seg=(a,b)=>plan.geom.filter((g,i)=>plan.cum[i]>=a-0.01&&plan.cum[i]<=b+0.01);
function drawMap(){
  if(!window.L) return; ensureMap(); if(!plan) return;
  const sel=ui.tab==="ov"?null:plan.days[ui.tab];
  plan.days.forEach((d,k)=>{ if(!d) return; const on=!sel||k===ui.tab; L.polyline(seg(d.a,d.b).map(g=>[g.lat,g.lon]),{color:on?DAYCOL[k%DAYCOL.length]:"#5C6660",weight:on?5:3,opacity:on?.9:.3}).addTo(layer); });
  if(panel){ drawPanelLayer(); return; }
  if(focusR){ const s=seg(focusR.a,focusR.b); if(s.length>1){L.polyline(s.map(g=>[g.lat,g.lon]),{color:"#B26A00",weight:7}).addTo(layer); map.fitBounds(L.latLngBounds(s.map(g=>[g.lat,g.lon])),{padding:[30,30]});} }
  const range=sel?[sel.a,sel.b]:[0,plan.total], inR=x=>x.km!=null&&x.km>=range[0]-1&&x.km<=range[1]+1;
  townPoints().forEach(p=>{ const km=plan.ptKm.get(p); if(sel&&!(km!=null&&km>=sel.a-0.5&&km<=sel.b+0.5)) return;
    const night=trip.days.some((d,k)=>d.to===p&&k<nDays()-1);
    const m=L.marker([p.lat,p.lon],{icon:dotIcon(night?"#2F5BA8":p.type==="fuel"?"#0B6E4F":"#18201C",night?16:12,p.type==="fuel")}).bindTooltip(p.name).addTo(layer);
    m.on("click",()=>{ const k=trip.days.findIndex((d,i)=>plan.days[i]&&plan.days[i].pts.includes(p)&&(sel?i===ui.tab:true)); if(k<0) return; const j=plan.days[k].pts.indexOf(p); openPanel(k,j,night?"stay":"fuel"); });
  });
  if(fp&&settings.fuelMode==="suggest"&&ui.fuelSugg) fp.fills.filter(f=>!f.mine&&inR(f)).forEach(f=>L.marker([f.lat,f.lon],{icon:dotIcon("#0B6E4F",11,true)}).bindTooltip("Suggested fuel: "+f.name).addTo(layer));
  if(ui.fuelAll) fuelStations.filter(inR).forEach(f=>L.marker([f.lat,f.lon],{icon:dotIcon("#ffffff",8,true)}).bindTooltip("Fuel: "+f.name).addTo(layer));
  pois.filter(p=>ui.types[p.kind]&&inR(p)).sort((a,b)=>a.off-b.off).slice(0,+ui.max).forEach(p=>{const t=TYPES.find(x=>x.id===p.kind); L.marker([p.lat,p.lon],{icon:dotIcon(t.c,10)}).bindTooltip(`${p.name} · ${t.n}`).addTo(layer);});
  if(ui.sleep) stays.forEach(s=>{ if(!trip.days.some((d,k)=>d.to===s.night&&k<nDays()-1)) return; s.places.forEach(p=>L.marker([p.lat,p.lon],{icon:dotIcon("#2F5BA8",9)}).bindTooltip(p.name).addTo(layer)); });
  if(!focusR){ const g=sel?seg(sel.a,sel.b):plan.geom; if(g.length>1&&(window._refit||sel||ui._lastSel!==ui.tab)){map.fitBounds(L.latLngBounds(g.map(x=>[x.lat,x.lon])),{padding:[24,24]});} window._refit=false; ui._lastSel=ui.tab; }
}
function drawPanelLayer(){
  const {k,j,tab}=panel, sc=scope(k,j); if(!sc) return;
  const s=sc.jj>0?seg(sc.a,sc.b):[];
  if(s.length>1) L.polyline(s.map(g=>[g.lat,g.lon]),{color:"#B26A00",weight:7}).addTo(layer);
  L.marker([sc.p.lat,sc.p.lon],{icon:dotIcon("#18201C",16)}).bindTooltip(sc.p.name).addTo(layer);
  const col={fuel:"#0B6E4F",stay:"#2F5BA8",food:"#B3261E",sight:"#9A6A33"}[tab], items=panelItems(k,j,tab);
  items.forEach(p=>L.marker([p.lat,p.lon],{icon:dotIcon(tab==="sight"?(TYPES.find(t=>t.id===p.kind)?.c||col):col,11,tab==="fuel")}).bindTooltip(p.name||"Fuel").addTo(layer));
  const pts=[...s,...items,sc.p].map(p=>[p.lat,p.lon]);
  if(tab==="stay"||sc.jj===0) map.setView([sc.p.lat,sc.p.lon],12); else if(pts.length>1) map.fitBounds(L.latLngBounds(pts),{padding:[30,30]});
}

/* ---------- layers menu ---------- */
function renderLayers(){
  const box=(id,on,label,dot)=>`<label><input type="checkbox" data-layer="${id}" ${on?"checked":""}>${dot}${label}</label>`;
  const sq=c=>`<span class="dot" style="background:${c};border-radius:2px;border:1px solid #18201C"></span>`;
  $("layers").innerHTML=box("fuelSugg",ui.fuelSugg,"Suggested fuel stops",sq("#0B6E4F"))+box("fuelAll",ui.fuelAll,"All fuel stations",sq("#ffffff"))+box("sleep",ui.sleep,"Places to stay at night stops",`<span class="dot" style="background:#2F5BA8"></span>`)
    +TYPES.map(t=>box("t-"+t.id,ui.types[t.id],t.n,`<span class="dot" style="background:${t.c}"></span>`)).join("")
    +`<label>Show up to <select data-max style="width:auto;padding:3px 6px">${[["10","10"],["25","25"],["50","50"],["1000","All"]].map(([v,l])=>`<option value="${v}" ${ui.max===v?"selected":""}>${l}</option>`).join("")}</select></label>`;
}
$("layers").addEventListener("change",e=>{ if(e.target.dataset.max!==undefined){ui.max=e.target.value;} else { const l=e.target.dataset.layer; if(!l) return; if(l.startsWith("t-")) ui.types[l.slice(2)]=e.target.checked; else ui[l]=e.target.checked; } saveUi(); renderAll(); });
document.addEventListener("click",e=>{const b=$("layersBox"); if(b.open&&!b.contains(e.target)) b.open=false; document.querySelectorAll(".legopts[open]").forEach(x=>{if(!x.contains(e.target)) x.open=false;});});

/* ---------- GPX ---------- */
function downloadGpx(k){
  const pd=plan.days[k]; if(!pd) return; const from=pd.pts[0], to=pd.pts[pd.pts.length-1];
  const name=`Day ${k+1} ${from.name} to ${to.name}`, g=seg(pd.a,pd.b);
  const w=[...pd.pts.slice(1).map(p=>({lat:p.lat,lon:p.lon,n:p.name})),...(fp&&settings.fuelMode==="suggest"?fp.fills.filter(f=>!f.mine&&f.km>pd.a&&f.km<=pd.b).map(f=>({lat:f.lat,lon:f.lon,n:"Fuel "+f.name})):[])];
  const text=`<?xml version="1.0" encoding="UTF-8"?>
<gpx version="1.1" creator="Route and Range" xmlns="http://www.topografix.com/GPX/1/1">
${w.map(p=>`  <wpt lat="${p.lat.toFixed(5)}" lon="${p.lon.toFixed(5)}"><name>${esc(p.n)}</name></wpt>`).join("\n")}
  <trk>
    <name>${esc(name)}</name>
    <trkseg>
${simplify(g,20).map(x=>`      <trkpt lat="${x.lat.toFixed(5)}" lon="${x.lon.toFixed(5)}"/>`).join("\n")}
    </trkseg>
  </trk>
</gpx>
`;
  const file=name.replace(/[^\w]+/g,"-").replace(/-+$/,"")+".gpx";
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([text],{type:"application/gpx+xml"})); a.download=file; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000);
  $("status").textContent=`Saved ${file}. Open it from your downloads and share it to your bike's app.`;
}

/* ---------- settings + glue ---------- */
SET_FIELDS.forEach(id=>$(id).value=settings[id]);
$("openSettings").addEventListener("click",()=>$("settings").showModal());
$("settings").addEventListener("close",()=>{
  const reroute=+$("corridor").value!==+settings.corridor||$("style").value!==settings.style;
  SET_FIELDS.forEach(id=>settings[id]=$(id).value); store.set("rr2-settings",settings);
  showStyle(); reroute?recalc():renderAll();
});
const STYLE_TEXT={rough:"<b>Road less travelled.</b> Back roads and gravel first, often the shortest and toughest way. Not for every bike or rider. Switch any day to Liaison, or change the style in Settings.",mixed:"<b>Mixed.</b> Gravel where it saves time, tar where it doesn't. Change it in Settings.",tar:"<b>Tar.</b> Main roads and highways. Change it in Settings."};
function showStyle(){ $("styleBanner").innerHTML=STYLE_TEXT[settings.style]||STYLE_TEXT.rough; }
function render(){ renderAll(); }
function renderAll(){
  fp=plan?fuelPlan():null;
  renderTripBar(); renderTabs();
  const ae=document.activeElement; if(!(ae&&ae.closest&&ae.closest("#details")&&ae.tagName==="INPUT")) renderDetails();
  if(panel) renderPanel();
  drawMap();
  const tot=plan?plan.days.reduce((t,d)=>t+(d?d.km:0),0):0;
  $("hdrSummary").textContent=plan?`${Math.round(tot)} km · ${nDays()} day${nDays()>1?"s":""}`:"";
}
function changed(){ window._refit=true; focusR=null; recalc(); }
renderLayers(); showStyle(); syncDays(); renderAll(); recalc();
</script></body></html>
